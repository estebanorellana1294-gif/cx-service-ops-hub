[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cx-integration"
version = "1.0.0"
description = "Integration layer: source serviceRequests API -> canonical ticket model"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.scripts]
cx-extract = "cx_integration.__main__:main"

[tool.setuptools]
packages = ["cx_integration"]
